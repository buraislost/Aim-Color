name: Build Bura EXE

on:
  push:
    branches: [bura-python]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name Bura --icon NONE Main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bura-exe
          path: dist/Bura.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/bura-python'
        with:
          tag_name: bura-v${{ github.run_number }}
          name: Bura Build ${{ github.run_number }}
          files: dist/Bura.exe
          draft: false
          prerelease: false
