name: Build Bura EXE

on:
  push:
    branches: [bura-python]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --console --name Bura --icon NONE Main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bura-exe
          path: dist/Bura.exe

