name: Build Bura EXE

on:
  push:
    branches: [bura-python]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: >-
          pyinstaller --onefile --console --name Bura --icon NONE
          --add-data "WebGui.py;."
          --hidden-import flask
          --hidden-import pystray
          --hidden-import PIL
          --hidden-import bettercam
          --hidden-import serial
          --hidden-import serial.tools.list_ports
          --hidden-import cv2
          --hidden-import numpy
          Main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bura-exe
          path: dist/Bura.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/bura-python'
        with:
          tag_name: bura-v${{ github.run_number }}
          name: Bura Build ${{ github.run_number }}
          files: dist/Bura.exe
          draft: false
          prerelease: false
